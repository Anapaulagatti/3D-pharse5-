name: Verify pixel art review candidate
on:
  push:
    branches: [rebuild/pixel-social-rpg-v3]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci --ignore-scripts
      - run: npm run assets:check && npm run typecheck && npm run lint && npm run format:check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-v4-browser-evidence
          path: quality-reports/unified-v4
# No pages:write, no deploy job. Replacement publication awaits explicit approval.
