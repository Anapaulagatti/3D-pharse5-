name: Publish approved v0.5 Joseon Fantasy Reforge showcase

# Public v0.5 publication was explicitly authorized by the repository owner.
# Documentation-only checkpoints do not redeploy the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/showcase-pages.yml
      - Studio/scripts/prepare-reforge-pages.py
      - showcase-v0.5/index.html
      - showcase-v0.5/build-info.json

permissions:
  contents: read

concurrency:
  group: showcase-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read configured GitHub Pages metadata
        uses: actions/configure-pages@v5
      - name: Verify and stage approved static showcase
        run: python3 Studio/scripts/prepare-reforge-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
